name: Test

# Fast checks on every push/PR. This workflow NEVER deploys and holds no
# Cloudflare credentials — production deploys run locally via `pnpm run deploy:prod`.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-checks:
    name: Fast checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from package.json "packageManager" — do not also
      # pass `version:` here (the action errors when both are given).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (app + tests)
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build Cloudflare Worker
        run: pnpm build:cf
